<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" font-family="Arial, sans-serif" font-size="14">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>
  
  <!-- Фон -->
  <rect width="600" height="900" fill="white"/>
  
  <!-- Старт -->
  <rect x="200" y="20" width="200" height="50" rx="25" ry="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="300" y="50" text-anchor="middle" fill="white" font-weight="bold">Старт</text>
  
  <!-- Стрелка -->
  <line x1="300" y1="70" x2="300" y2="100" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 1. Пути -->
  <rect x="150" y="100" width="300" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="300" y="125" text-anchor="middle" fill="#333">1. Указать PATCH_IN</text>
  <text x="300" y="145" text-anchor="middle" fill="#333">и PATCH_OUT</text>
  
  <!-- Стрелка -->
  <line x1="300" y1="160" x2="300" y2="190" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 2. Рубрикатор -->
  <rect x="150" y="190" width="300" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="300" y="215" text-anchor="middle" fill="#333">2. Рубрикатор</text>
  <text x="300" y="235" text-anchor="middle" fill="#333">FILES + PROMPTS</text>
  
  <!-- Стрелка -->
  <line x1="300" y1="250" x2="300" y2="280" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- 3. Сканирование -->
  <rect x="150" y="280" width="300" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="300" y="305" text-anchor="middle" fill="#333">3. F5: Сканирование</text>
  <text x="300" y="325" text-anchor="middle" fill="#333">*.plp</text>
  
  <!-- Стрелка -->
  <line x1="300" y1="340" x2="300" y2="370" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- preserve? -->
  <polygon points="300,370 420,410 300,450 180,410" fill="#B7C68B" stroke="#5a8a3a" stroke-width="2"/>
  <text x="300" y="415" text-anchor="middle" fill="#333" font-weight="bold">preserve?</text>
  
  <!-- Да -->
  <line x1="420" y1="410" x2="480" y2="410" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="405" text-anchor="middle" fill="#333">Да</text>
  
  <!-- Копирование -->
  <rect x="480" y="380" width="120" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="540" y="405" text-anchor="middle" fill="#333">Копирование</text>
  <text x="540" y="425" text-anchor="middle" fill="#333">структуры</text>
  
  <!-- Стрелка вниз от Копирование -->
  <line x1="540" y1="440" x2="540" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="500" x2="300" y2="500" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Нет -->
  <line x1="300" y1="450" x2="300" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="470" text-anchor="start" fill="#333">Нет</text>
  
  <!-- Проблемы? -->
  <polygon points="300,480 420,520 300,560 180,520" fill="#B7C68B" stroke="#5a8a3a" stroke-width="2"/>
  <text x="300" y="525" text-anchor="middle" fill="#333" font-weight="bold">Проблемы?</text>
  
  <!-- Нет -->
  <line x1="300" y1="560" x2="300" y2="610" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="320" y="590" text-anchor="start" fill="#333">Нет</text>
  
  <!-- Конец -->
  <rect x="200" y="610" width="200" height="50" rx="25" ry="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
  <text x="300" y="640" text-anchor="middle" fill="white" font-weight="bold">Конец</text>
  
  <!-- Да -->
  <line x1="420" y1="520" x2="480" y2="520" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="445" y="515" text-anchor="middle" fill="#333">Да</text>
  
  <!-- 4. Исправление -->
  <rect x="480" y="490" width="120" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="540" y="515" text-anchor="middle" fill="#333">4. Исправление</text>
  <text x="540" y="535" text-anchor="middle" fill="#333">fixer.fix</text>
  
  <!-- Стрелка от Исправление к Автоархив? -->
  <line x1="540" y1="550" x2="540" y2="600" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Автоархив? -->
  <polygon points="540,600 620,640 540,680 460,640" fill="#B7C68B" stroke="#5a8a3a" stroke-width="2"/>
  <text x="540" y="645" text-anchor="middle" fill="#333" font-weight="bold">Автоархив?</text>
  
  <!-- Да -->
  <line x1="620" y1="640" x2="580" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="630" y="680" text-anchor="start" fill="#333">Да</text>
  
  <!-- Архив -->
  <rect x="500" y="720" width="160" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="580" y="745" text-anchor="middle" fill="#333">Архив</text>
  <text x="580" y="765" text-anchor="middle" fill="#333">_run_archive</text>
  
  <!-- Нет -->
  <line x1="540" y1="680" x2="540" y2="720" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="555" y="705" text-anchor="start" fill="#333">Нет</text>
  
  <!-- ZIP -->
  <rect x="460" y="720" width="160" height="60" rx="5" ry="5" fill="#e8f5e0" stroke="#5a8a3a" stroke-width="2"/>
  <text x="540" y="745" text-anchor="middle" fill="#333">5. ZIP</text>
  <text x="540" y="765" text-anchor="middle" fill="#333">+ .pck</text>
  
  <!-- Стрелка от Архив к ZIP -->
  <line x1="500" y1="750" x2="460" y2="750" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Стрелка от ZIP к Конец -->
  <line x1="540" y1="780" x2="300" y2="780" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="780" x2="300" y2="660" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
